<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <rect width="800" height="500" fill="#fff"/>
  <!-- Solid disc: curved edges at every angle -->
  <circle cx="150" cy="250" r="110" fill="#000"/>
  <!-- Fan of lines, 1px to 10px thick: thin lines are where too few samples break up -->
  <g stroke="#000" stroke-linecap="round">
    <line x1="300" y1="60" x2="300" y2="440" stroke-width="1"/>
    <line x1="300" y1="60" x2="350" y2="440" stroke-width="2"/>
    <line x1="300" y1="60" x2="400" y2="440" stroke-width="3"/>
    <line x1="300" y1="60" x2="450" y2="440" stroke-width="5"/>
    <line x1="300" y1="60" x2="510" y2="440" stroke-width="7"/>
    <line x1="300" y1="60" x2="580" y2="440" stroke-width="10"/>
  </g>
  <!-- Triangle: long straight diagonal edges -->
  <polygon points="660,60 770,440 550,440" fill="#000"/>
</svg>
